name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: pwsh
        run: |
          $package = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'ridff-tools'
          if ($env:GITHUB_REF_NAME -cne "v$($package.version)") { throw 'Tag must match Cargo.toml version' }
          if ($package.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable releases only' }
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install wix --version 4.0.6 --tool-path target/wix-tools
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          target/wix-tools/wix.exe extension add -g WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed' }
          ./installer/build.ps1 -ExePath target/x86_64-pc-windows-msvc/release/rdiff.exe
      - name: Publish executable and installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/rdiff.exe rdiff-windows-x86_64.exe
          $msi = (Get-ChildItem target/release-assets/*.msi).FullName
          gh release create $env:GITHUB_REF_NAME rdiff-windows-x86_64.exe $msi --verify-tag --generate-notes --title "rdiff $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
