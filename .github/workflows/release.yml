name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: pwsh
        run: |
          $package = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'ridff-tools'
          if ($env:GITHUB_REF_NAME -cne "v$($package.version)") { throw 'Tag must match Cargo.toml version' }
          if ($package.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable releases only' }
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install wix --version 4.0.6 --tool-path target/wix-tools
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          target/wix-tools/wix.exe extension add -g WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed' }
          ./installer/build.ps1 -ExePath target/x86_64-pc-windows-msvc/release/rdiff.exe
      - name: Stage executable
        shell: pwsh
        run: |
          Copy-Item target/x86_64-pc-windows-msvc/release/rdiff.exe target/release-assets/rdiff-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            target/release-assets/*.exe
            target/release-assets/*.msi
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ridff-tools"))')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Apple Silicon target
        run: rustup target add aarch64-apple-darwin
      - name: Test
        run: cargo test --release --locked --bin rdiff --target aarch64-apple-darwin
      - name: Build DMG
        run: bash installer/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            target/release-assets/*.dmg
            target/release-assets/*.sha256
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "rdiff $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
